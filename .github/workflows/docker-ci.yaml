name: Docker CI Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # السطر السحري اللي بيعمل زرار التشغيل اليدوي

jobs:
  build-and-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout the code
        uses: actions/checkout@v3

      - name: 2. Build the Docker Image
        run: docker build -t my-app-test .

      - name: 3. Run the container temporarily
        run: docker run -d -p 3000:3000 --name test-container my-app-test

      - name: 4. Check if the app is responding
        run: sleep 5 && curl http://localhost:3000
